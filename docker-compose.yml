services:
  db:
    image: postgres:16-alpine
    container_name: voice2flow_db
    restart: always
    environment:
      POSTGRES_USER: voice2flow
      POSTGRES_PASSWORD: voice2flow_secret
      POSTGRES_DB: voice2flow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice2flow -d voice2flow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
